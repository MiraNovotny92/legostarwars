<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lego Star Wars Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Start Screen Overlay -->
        <div id="start-screen" class="overlay">
            <h2>Lego Star Wars Explorer</h2>
            
            <p>1. Select Your Hero:</p>
            <div class="character-select">
                <div class="char-card selected" onclick="selectCharacter('luke', this)">
                    <div class="char-avatar" style="background: #2ecc71;"></div>
                    <span>Luke</span>
                </div>
                <div class="char-card" onclick="selectCharacter('ahsoka', this)">
                    <div class="char-avatar" style="background: #3498db;"></div>
                    <span>Ahsoka</span>
                </div>
                <div class="char-card" onclick="selectCharacter('anakin', this)">
                    <div class="char-avatar" style="background: #00bfff;"></div>
                    <span>Anakin</span>
                </div>
                <div class="char-card" onclick="selectCharacter('vader', this)">
                    <div class="char-avatar" style="background: #e74c3c;"></div>
                    <span>Vader</span>
                </div>
            </div>

            <p>2. Select Mission:</p>
            <div class="mission-select">
                <button class="mission-btn selected" onclick="selectMission(1, this)">🗡️ 1. Find Lightsaber</button>
                <button class="mission-btn" onclick="selectMission(2, this)">💎 2. Kyber Crystals</button>
                <button class="mission-btn" onclick="selectMission(3, this)">💚 3. Rescue Grogu</button>
            </div>

<div class="menu-buttons" style="margin-top: 20px;">
                <button onclick="startGame()" style="background-color: #2ecc71; font-size: 20px; padding: 15px 30px; border-radius: 12px;">▶ START MISSION</button>
            </div>
            <button id="fullscreen-btn" onclick="toggleFullscreen()" style="background-color: #fca311; margin-top: 8px;">📺 Fullscreen</button>
        </div>

        <!-- Win Screen Overlay -->
        <div id="win-screen" class="overlay" style="display: none;">
            <h2 style="color: #00ff00; text-shadow: 0 0 20px #00ff00;">🎉 MISSION COMPLETE! 🎉</h2>
            <p id="win-message">The Force will be with you, always.</p>
            <div id="win-stats" class="stats-box">
                <p>⏱️ Time: <span id="final-time" style="color: #00bfff;">00:00.0</span></p>
                <p>🟡 Studs: <span id="final-studs" style="color: #fca311;">0</span></p>
                <p id="true-jedi-badge" style="color: #ffd700; display: none; font-size: 18px;">🌟 TRUE JEDI STATUS ACHIEVED! 🌟</p>
            </div>
            <button onclick="location.reload()">Play Next Mission</button>
        </div>

        <!-- Dialogue Box -->
        <div id="dialogue-box" style="display: none;">
            <span id="dialogue-text"></span>
        </div>

        <!-- Dashboard -->
        <div id="dashboard">
            <div id="timer-display">⏱️ <span id="timer-text" style="color: #00bfff;">00:00.0</span></div>
            
            <div class="true-jedi-container">
                <span class="tj-label">TRUE JEDI</span>
                <div class="tj-bar"><div id="tj-fill"></div></div>
            </div>

            <div id="score-display">Studs: <span id="score-text" style="color: #fca311;">0</span></div>
            <button id="shield-buy-btn" onclick="buyShield()" class="shop-btn">🛡️ Shield (50🟡)</button>
            <button id="mute-btn" onclick="toggleMute()" class="mini-fs-btn">🔊 Sound On</button>
            <button onclick="toggleFullscreen()" class="mini-fs-btn">📺</button>
            <div id="version-tag" style="font-size: 11px; opacity: 0.6; align-self: flex-end;">v1.0.0</div>
        </div>

        <!-- Main Canvas -->
        <canvas id="gameCanvas" width="1200" height="600"></canvas>

        <!-- Touch Controls HUD -->
        <div id="touch-controls">
            <div class="touch-group">
                <button id="btn-left" class="touch-btn">⬅️</button>
                <button id="btn-right" class="touch-btn">➡️</button>
            </div>
            <div class="touch-group">
                <button id="btn-attack" class="touch-btn attack-btn">⚔️ SLASH [D]</button>
                <button id="btn-force" class="touch-btn force-btn">✨ FORCE [F]</button>
                <button id="btn-jump" class="touch-btn jump-btn">🦘 JUMP</button>
            </div>
        </div>
    </div>

<!-- Script Chain -->
    <script src="js/globals.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/entities.js"></script>
    
    <!-- Load Mission Files Here -->
    <script src="js/missions/mission1.js"></script>
    
    <!-- Level Manager and Main Game -->
    <script src="js/levels.js"></script>
    <script src="game.js"></script>
</body>
</html>
