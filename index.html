<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lego Star Wars Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Start Screen Overlay -->
        <div id="start-screen" class="overlay">
            <h2>Lego Star Wars Explorer</h2>
            <p>Help Jedi find Obi-Wan's Lost Lightsaber!</p>
            <div class="menu-buttons">
                <button onclick="startGame(1)">Padawan (Easy)</button>
                <button onclick="startGame(2)">Jedi Knight (Medium)</button>
                <button onclick="startGame(3)">Jedi Master (Hard)</button>
            </div>
            <button id="fullscreen-btn" onclick="toggleFullscreen()" style="background-color: #fca311;">📺 Toggle Fullscreen</button>
        </div>

        <!-- Win Screen Overlay -->
        <div id="win-screen" class="overlay" style="display: none;">
            <h2 style="color: #00ff00;">Mission Complete!</h2>
            <p>The Force will be with you, always.</p>
            <button onclick="location.reload()">Play Again</button>
        </div>

        <!-- Dialogue Box -->
        <div id="dialogue-box" style="display: none;">
            <span id="dialogue-text"></span>
        </div>

        <!-- Dashboard -->
        <div id="dashboard">
            <div id="score-display">Studs: <span id="score-text" style="color: #fca311;">0</span></div>
            <div id="quest-status">
                Lightsaber: 
                <span id="saber-text" style="color: #ff4d4d;">Missing</span>
                <img id="saber-icon" src="assets/saber.png" style="display: none; height: 24px; vertical-align: middle;">
            </div>
            <button onclick="toggleFullscreen()" class="mini-fs-btn">📺</button>
        </div>

        <!-- Main Canvas -->
        <canvas id="gameCanvas" width="1200" height="600"></canvas>

        <!-- Touch Controls HUD -->
        <div id="touch-controls">
            <div class="touch-group">
                <button id="btn-left" class="touch-btn">⬅️</button>
                <button id="btn-right" class="touch-btn">➡️</button>
            </div>
            <div class="touch-group">
                <button id="btn-force" class="touch-btn force-btn">✨ FORCE</button>
                <button id="btn-jump" class="touch-btn jump-btn">🦘 JUMP</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
