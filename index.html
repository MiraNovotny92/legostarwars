<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lego Star Wars Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Lego Star Wars Explorer</h1>
    
    <div id="game-container">
        <!-- New UI Dashboard -->
        <div id="dashboard">
            <div id="controls"><strong>Controls:</strong> ⬅️ ➡️ Move | SPACE Jump | Hold 'F' Force</div>
            <div id="quest-status">Lightsaber: <span id="saber-text" style="color: red;">Missing</span></div>
        </div>

        <!-- The Game -->
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <!-- New HTML Dialogue Box -->
        <div id="dialogue-box" style="display: none;">
            <p id="dialogue-text"></p>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
